name: Deploy Zoro 24/7 Cloud Core

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'Dockerfile'
      - 'requirements-server.txt'
      - 'requirements.txt'
      - '.github/workflows/deploy-zoro-agent.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Push & Deploy Cloud Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name baseformacrza

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            baseformacrza.azurecr.io/zoro-agent:${{ github.sha }}
            baseformacrza.azurecr.io/zoro-agent:latest
            ghcr.io/senzekoskhathi/zoro:${{ github.sha }}
            ghcr.io/senzekoskhathi/zoro:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy new revision to Azure Container Apps
        run: |
          az containerapp update \
            --name zoro-agent \
            --resource-group LumenAI \
            --image baseformacrza.azurecr.io/zoro-agent:${{ github.sha }}
